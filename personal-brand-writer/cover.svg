<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="wave3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="#f6efe1"/>

  <!-- tech waves -->
  <g fill="none" stroke-linecap="round">
    <path d="M -50 55 C 220 15, 380 105, 620 55 S 1010 10, 1250 55"
          stroke="url(#wave1)" stroke-width="3" opacity="0.5"/>
    <path d="M -50 88 C 240 135, 420 40, 660 88 S 1020 135, 1250 88"
          stroke="url(#wave2)" stroke-width="2.5" opacity="0.4"/>
    <path d="M -50 270 C 210 235, 390 300, 630 270 S 1010 235, 1250 270"
          stroke="url(#wave3)" stroke-width="3" opacity="0.5"/>
    <path d="M -50 287 C 230 262, 430 300, 670 282 S 1030 258, 1250 287"
          stroke="url(#wave1)" stroke-width="2" opacity="0.3"/>
  </g>

  <!-- speech-bubble dots along top wave -->
  <g fill="#fb7185" opacity="0.6">
    <circle cx="220" cy="16" r="4"/>
    <circle cx="500" cy="84" r="4"/>
    <circle cx="780" cy="20" r="4"/>
    <circle cx="1060" cy="80" r="4"/>
  </g>

  <text x="56" y="102" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="#1e293b">
    Personal Brand Writer
  </text>
  <text x="56" y="138" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#57534e">
    A Claude Skill: your idea in, a LinkedIn or X post in your own voice out
  </text>

  <!-- four post-type cards -->
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="56" y="180" width="255" height="90" rx="10" fill="#fffdf8" stroke="#e7dfc9" stroke-width="1.5"/>
    <rect x="56" y="180" width="6" height="90" rx="3" fill="#fb7185"/>
    <text x="80" y="212" font-size="18" font-weight="700" fill="#be123c">Story</text>
    <text x="80" y="238" font-size="14" fill="#6b7280">milestones, recaps, lessons</text>

    <rect x="327" y="180" width="255" height="90" rx="10" fill="#fffdf8" stroke="#e7dfc9" stroke-width="1.5"/>
    <rect x="327" y="180" width="6" height="90" rx="3" fill="#6366f1"/>
    <text x="351" y="212" font-size="18" font-weight="700" fill="#4338ca">Opinion</text>
    <text x="351" y="238" font-size="14" fill="#6b7280">a clear take, backed by experience</text>

    <rect x="598" y="180" width="255" height="90" rx="10" fill="#fffdf8" stroke="#e7dfc9" stroke-width="1.5"/>
    <rect x="598" y="180" width="6" height="90" rx="3" fill="#f59e0b"/>
    <text x="622" y="212" font-size="18" font-weight="700" fill="#b45309">Stat</text>
    <text x="622" y="238" font-size="14" fill="#6b7280">one real, sourced number</text>

    <rect x="869" y="180" width="275" height="90" rx="10" fill="#fffdf8" stroke="#e7dfc9" stroke-width="1.5"/>
    <rect x="869" y="180" width="6" height="90" rx="3" fill="#14b8a6"/>
    <text x="893" y="212" font-size="18" font-weight="700" fill="#0f766e">Tech in marketing</text>
    <text x="893" y="238" font-size="14" fill="#6b7280">the workflow, minus the hype</text>
  </g>
</svg>
